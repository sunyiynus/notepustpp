[package]
name = "notepust-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Notepust desktop editor"

[[bin]]
name = "notepust"
path = "src/main.rs"

[dependencies]
notepust-contracts = { path = "../contracts" }
notepust-file-io = { path = "../file-io" }
notepust-large-file = { path = "../large-file" }
notepust-platform = { path = "../platform" }
notepust-search = { path = "../search" }
notepust-storage = { path = "../storage" }
notepust-text-codec = { path = "../text-codec" }
anyhow = { workspace = true }
blake3 = { workspace = true }
clap = { workspace = true }
directories = { workspace = true }
futures = { workspace = true }
gpui-kit = { workspace = true }
ropey = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
tree-sitter = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.12", features = ["test-support"] }
